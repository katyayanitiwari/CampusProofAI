services:
  backend:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./artifacts:/app/artifacts", "./models:/app/models"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

